services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DATABASE_URL: postgresql://nascon:nascon@postgres:5432/nascon
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://nascon:nascon@rabbitmq:5672/
      STORAGE_BACKEND: local
      STORAGE_PATH: /data/storage
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nascon
      RABBITMQ_DEFAULT_PASS: nascon
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  storage_data: