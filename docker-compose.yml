services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      JWT_SECRET: ${JWT_SECRET:-nascon-dev-jwt-secret}
      DATABASE_URL: postgresql://nascon:nascon@postgres:5432/nascon
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://nascon:nascon@rabbitmq:5672/
      MEDIAMTX_API: http://mediamtx:9997
      PUBLIC_BASE_URL: http://localhost:8080
      STORAGE_BACKEND: local
      STORAGE_PATH: /data/storage
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: nascon
      RABBITMQ_DEFAULT_PASS: nascon
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  # Image is FROM scratch (no shell), so readiness is checked by the backend's /health via the API on :9997.
  mediamtx:
    image: bluenviron/mediamtx:1.9.1
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: nascon-selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  node-chrome-1:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false

  node-chrome-2:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false

  node-firefox:
    image: selenium/node-firefox:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false

volumes:
  pgdata:
  storage_data:
